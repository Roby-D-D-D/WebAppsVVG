<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green IT - Kontakt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Green IT & Computing</h1>
        <p>Stupite u kontakt s nama</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Početna</a></li>
            <li><a href="novosti.html">Novosti</a></li>
            <li><a href="galerija.html">Galerija</a></li>
            <li><a href="o-nama.html">O nama</a></li>
            <li><a href="kontakt.html" class="active">Kontakt</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Kontaktirajte nas</h2>
            
            <div class="grid-container">
                <div>
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d5571.656707506999!2d16.069912108762384!3d45.714480198186884!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47667e543ebb2c65%3A0xe159703d90972cf3!2sVeleu%C4%8Dili%C5%A1te%20Velika%20Gorica!5e0!3m2!1shr!2shr!4v1767623007370!5m2!1shr!2shr" width="100%" height="400" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                </div>

                <div>
                    <form action="#" method="post">
                        <label for="ime">Ime *</label>
                        <input type="text" id="ime" name="firstname" required placeholder="Vaše ime">

                        <label for="prezime">Prezime *</label>
                        <input type="text" id="prezime" name="lastname" required placeholder="Vaše prezime">

                        <label for="email">E-mail adresa *</label>
                        <input type="email" id="email" name="email" required placeholder="vas@email.com">

                        <label for="drzava">Država</label>
                        <select id="drzava" name="country">
                            <option value="hr">Hrvatska</option>
                            <option value="de">Njemačka</option>
                            <option value="other">Ostalo</option>
                        </select>

                        <label for="opis">Opis</label>
                        <textarea id="opis" name="subject" style="height:150px" placeholder="Vaša poruka..."></textarea>

                        <input type="submit" value="Pošalji">
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2024 Green IT Projekt. <a href="https://github.com" target="_blank">Moj GitHub</a></p>
    </footer>
</body>
</html>
